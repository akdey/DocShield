[project]
name = "docshield"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=47.0.0",
    "flashtext>=2.7",
    "gliner>=0.2.26",
    "loguru>=0.7.3",
    "pdfplumber>=0.11.9",
    "presidio-analyzer>=2.2.362",
    "presidio-anonymizer>=2.2.362",
    "pydantic>=2.13.3",
    "pydantic-settings>=2.14.0",
    "pypdf>=6.10.2",
    "python-docx>=1.2.0",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "spacy>=3.8.14",
    "typer>=0.25.1",
]

[project.scripts]
docshield = "docshield.cli:app"
