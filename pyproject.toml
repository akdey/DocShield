[project]
name = "docshield"
version = "0.3.0"
description = "A fully offline, stateless business document anonymizer using AES-SIV encryption."
readme = "README.md"
authors = [
    { name = "Amit Kumar Dey", email = "akdey@users.noreply.github.com" }
]
license = { text = "MIT" }
keywords = ["anonymizer", "pii", "nlp", "presidio", "gliner", "privacy", "security"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security :: Cryptography",
]
requires-python = ">=3.11"
dependencies = [
    "cryptography>=47.0.0",
    "flashtext>=2.7",
    "fpdf2>=2.8.7",
    "gliner>=0.2.26",
    "loguru>=0.7.3",
    "pdfplumber>=0.11.9",
    "presidio-analyzer>=2.2.362",
    "presidio-anonymizer>=2.2.362",
    "pydantic>=2.13.3",
    "pydantic-settings>=2.14.0",
    "pyinstaller>=6.20.0",
    "pymupdf>=1.27.2.3",
    "pypdf>=6.10.2",
    "python-docx>=1.2.0",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "spacy>=3.8.14",
    "typer>=0.25.1",
]

[project.scripts]
docshield = "docshield.cli:app"

[project.urls]
Homepage = "https://github.com/akdey/DocShield"
Repository = "https://github.com/akdey/DocShield"
Issues = "https://github.com/akdey/DocShield/issues"
